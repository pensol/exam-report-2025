<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2025年度 入試受験レポート入力</title>
  <style>
:root {
  --page-ratio: 1.43057;
  --ui-blue: #1769aa;
  --mark-size: 78%;
  --mark-offset-x: 0%;
  --mark-offset-y: 0%;
}
* { box-sizing: border-box; }
body { margin:0; background:#e8ebef; color:#1d252c; font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif; }
.toolbar { position:sticky; z-index:10; top:0; display:flex; gap:12px; align-items:center; padding:10px 16px; background:#fff; box-shadow:0 1px 6px #0003; }
.toolbar strong { margin-right:auto; }
.toolbar button { border:1px solid #a8b4bf; border-radius:5px; background:#fff; padding:7px 12px; cursor:pointer; }
#print-button { color:white; border-color:var(--ui-blue); background:var(--ui-blue); }
#save-status { color:#557; font-size:13px; }
main { padding:10px 12px 30px; }
.help { margin:2px auto 10px; max-width:1206px; font-size:13px; }
.sheet-wrap { width:100%; }
.sheet { position:relative; width:min(100%, 1600px); aspect-ratio:1206.48 / 843.36; margin:auto; background:white; box-shadow:0 2px 12px #0004; overflow:hidden; }
.sheet > img { position:absolute; inset:0; width:100%; height:100%; user-select:none; pointer-events:none; }
#overlay { position:absolute; inset:0; }
.field { position:absolute; margin:0; padding:1px 2px; border:1px solid transparent; outline:none; color:#101010; background:rgba(255,255,255,.04); font-family:"Yu Gothic",Meiryo,sans-serif; line-height:1.35; resize:none; overflow:hidden; border-radius:0; }
.field:focus { background:rgba(255,252,205,.52); border-color:#e3a600; }
.mark { position:absolute; border:0; padding:0; background:transparent; cursor:pointer; }
.mark::after { content:""; position:absolute; left:calc(50% + var(--mark-offset-x)); top:calc(50% + var(--mark-offset-y)); width:var(--mark-size); height:var(--mark-size); transform:translate(-50%,-50%); border:0.75pt solid transparent; border-radius:50%; }
.mark.selected::after { border-color:#111; }
.debug .field, .debug .mark { border:1px dashed #e50000; background:rgba(255,230,0,.14); overflow:visible; }
.debug .field::before, .debug .mark::before { content:attr(data-debug); position:absolute; z-index:2; left:0; top:100%; white-space:nowrap; color:#b00000; background:#fffbdc; font:7px/1.15 monospace; pointer-events:none; }
.mobile-form { display:none; max-width:720px; margin:0 auto 14px; }
.mobile-group { margin:0 0 12px; padding:12px; border-radius:10px; background:#fff; box-shadow:0 1px 5px #0002; }
.mobile-group h2 { margin:0 0 9px; font-size:16px; }
.mobile-control { display:block; margin:0 0 12px; font-size:13px; font-weight:600; }
.mobile-control input, .mobile-control textarea { display:block; width:100%; min-height:44px; margin-top:5px; padding:9px 10px; border:1px solid #9daab6; border-radius:7px; background:#fff; font:16px/1.45 system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif; }
.mobile-control textarea { min-height:96px; resize:vertical; }
.mobile-mark { width:100%; min-height:46px; margin:0 0 8px; padding:9px 12px; border:1px solid #9daab6; border-radius:7px; background:#fff; text-align:left; font-size:16px; }
.mobile-mark::before { content:'○を付ける'; display:inline-block; min-width:6em; margin-right:8px; color:#52606b; }
.mobile-mark.selected { border-color:var(--ui-blue); background:#e8f3fc; }
.mobile-mark.selected::before { content:'○  選択中'; color:#075d9b; font-weight:700; }
#mobile-form-button, #preview-button { display:none; }

@media (max-width: 700px) {
  .toolbar { position:sticky; flex-wrap:wrap; gap:7px; padding:8px; }
  .toolbar strong { flex:1 0 calc(100% - 95px); font-size:14px; }
  #save-status { font-size:11px; }
  #mobile-form-button, #preview-button { display:inline-block; }
  #debug-label, #clear-button { display:none; }
  main { padding:8px; }
  .help { font-size:12px; }
  .mobile-form { display:block; }
  .sheet-wrap { display:none; overflow:auto; padding-bottom:8px; }
  body.preview-mode .mobile-form { display:none; }
  body.preview-mode .sheet-wrap { display:block; }
  body.preview-mode .sheet { width:1000px; max-width:none; }
  #print-button { margin-left:auto; }
}

@page { size:425.62mm 297.52mm; margin:0; }
@media print {
  html, body { width:425.62mm; height:297.52mm; margin:0!important; padding:0!important; background:white; }
  .toolbar, .help, .mobile-form { display:none!important; }
  .sheet-wrap { display:block!important; overflow:visible!important; }
  main { margin:0; padding:0; }
  .sheet { width:425.62mm; height:297.52mm; margin:0; box-shadow:none; overflow:hidden; }
  .field { border:0!important; background:transparent!important; }
  .field { font-size:calc(var(--font-pt) * 1pt)!important; }
  .mark { border:0!important; background:transparent!important; }
  .debug .field::before, .debug .mark::before { display:none!important; }
}

</style>

  {id:'support_plan',label:'対策内容',x:835,y:730,w:316,h:45,type:'textarea',font:9},
];

</script>
  <script>
(() => {
  'use strict';
  const STORAGE_KEY = 'exam-report-2025-v1';
  const overlay = document.querySelector('#overlay');
  const sheet = document.querySelector('#sheet');
  const mobileForm = document.querySelector('#mobile-form');
  const status = document.querySelector('#save-status');
  let state = {};
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (_) {}

  const pct = (value, total) => `${value / total * 100}%`;
  const debounce = (fn, wait=180) => { let timer; return () => { clearTimeout(timer); timer=setTimeout(fn,wait); }; };
  const save = debounce(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    status.textContent = `保存済み ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
  });

  const updateValue = (id, value, source) => {
    state[id] = value;
    const desktop = document.getElementById(id);
    const mobile = document.getElementById(`mobile-${id}`);
    if (desktop && desktop !== source) {
      if (desktop.classList.contains('mark')) desktop.classList.toggle('selected', !!value);
      else desktop.value = value || '';
    }
    if (mobile && mobile !== source) {
      if (mobile.classList.contains('mobile-mark')) mobile.classList.toggle('selected', !!value);
      else mobile.value = value || '';
    }
    status.textContent='保存中…'; save();
  };

  function place(el, f) {
    el.style.left = pct(f.x + (f.dx || 0), PAGE.width);
    el.style.top = pct(f.y + (f.dy || 0), PAGE.height);
    el.style.width = pct(f.w, PAGE.width);
    el.style.height = pct(f.h, PAGE.height);
    el.style.setProperty('--font-pt', f.font || 9);
    if (f.align) el.style.textAlign = f.align;
    el.dataset.debug = `${f.id}  x:${f.x} y:${f.y} w:${f.w} h:${f.h}`;
    el.setAttribute('aria-label', f.label || f.id);
  }

  FIELDS.forEach((f, index) => {
    let el;
    if (f.type === 'mark') {
      el = document.createElement('button');
      el.type = 'button'; el.className = 'mark';
      el.classList.toggle('selected', !!state[f.id]);
      el.addEventListener('click', () => {
        updateValue(f.id, !state[f.id], el);
        el.classList.toggle('selected', !!state[f.id]);
      });
    } else {
      el = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
      el.className = 'field'; el.value = state[f.id] || '';
      if (el.tagName === 'INPUT') el.type = f.type === 'number' ? 'text' : 'text';
      if (f.type === 'number') el.inputMode = 'numeric';
      el.tabIndex = index + 1;
      el.addEventListener('input', () => updateValue(f.id, el.value, el));
    }
    el.id = f.id; place(el, f); overlay.appendChild(el);
  });

  function scaleFonts() {
    const scale = sheet.getBoundingClientRect().width / PAGE.width;
    FIELDS.forEach(f => {
      const el = document.getElementById(f.id);
      if (el && f.type !== 'mark') el.style.fontSize = `${(f.font || 9) * scale}px`;
    });
  }
  scaleFonts();
  new ResizeObserver(scaleFonts).observe(sheet);

  const groups = [
    ['基本情報・受験結果', f => f.y < 300 && f.x < 610],
    ['志望・強み・活動', f => f.y >= 300 && f.x < 610],
    ['受験科目・面接', f => f.x >= 610 && f.y < 270],
    ['小論文・その他科目', f => f.x >= 610 && f.y >= 270 && f.y < 700],
    ['受験対策', f => f.x >= 610 && f.y >= 700],
  ];
  groups.forEach(([title, predicate]) => {
    const fields = FIELDS.filter(predicate);
    if (!fields.length) return;
    const section = document.createElement('section');
    section.className = 'mobile-group';
    const heading = document.createElement('h2'); heading.textContent = title; section.appendChild(heading);
    fields.forEach(f => {
      let control;
      if (f.type === 'mark') {
        control = document.createElement('button'); control.type='button'; control.className='mobile-mark';
        control.textContent=f.label; control.classList.toggle('selected', !!state[f.id]);
        control.addEventListener('click', () => { updateValue(f.id, !state[f.id], control); control.classList.toggle('selected', !!state[f.id]); });
        section.appendChild(control);
      } else {
        const label = document.createElement('label'); label.className='mobile-control'; label.textContent=f.label;
        control = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
        control.value=state[f.id] || ''; if (f.type === 'number') control.inputMode='numeric';
        control.addEventListener('input', () => updateValue(f.id, control.value, control));
        label.appendChild(control); section.appendChild(label);
      }
      control.id=`mobile-${f.id}`;
    });
    mobileForm.appendChild(section);
  });

  document.querySelector('#mobile-form-button').addEventListener('click', () => document.body.classList.remove('preview-mode'));
  document.querySelector('#preview-button').addEventListener('click', () => document.body.classList.add('preview-mode'));

  document.querySelector('#debug-toggle').addEventListener('change', e => sheet.classList.toggle('debug', e.target.checked));
  document.querySelector('#print-button').addEventListener('click', () => window.print());
  document.querySelector('#clear-button').addEventListener('click', () => {
    if (!confirm('保存されている入力内容をすべて消去しますか？')) return;
    state = {}; localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.field').forEach(el => el.value='');
    document.querySelectorAll('.mark').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.mobile-control input, .mobile-control textarea').forEach(el => el.value='');
    document.querySelectorAll('.mobile-mark').forEach(el => el.classList.remove('selected'));
    status.textContent='入力を消去しました';
  });
})();

</script>
</body>
