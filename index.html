<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2025年度 入試受験レポート入力</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <strong>2025年度 入試受験レポート</strong>
    <span id="save-status" aria-live="polite">自動保存</span>
    <button id="mobile-form-button" type="button" aria-controls="mobile-form">入力一覧</button>
    <button id="preview-button" type="button" aria-controls="sheet">用紙プレビュー</button>
    <label id="debug-label"><input id="debug-toggle" type="checkbox"> 座標デバッグ</label>
    <button id="clear-button" type="button">入力を消去</button>
    <button id="print-button" type="button">印刷 / PDF保存</button>
  </header>
  <main>
    <p class="help">欄をクリックして入力します。選択欄はクリックで○、もう一度クリックで解除できます。</p>
    <section id="mobile-form" class="mobile-form" aria-label="スマートフォン入力一覧"></section>
    <div id="sheet-wrap" class="sheet-wrap">
      <section id="sheet" class="sheet" aria-label="受験レポート入力用紙">
        <img src="blank_2025.png" alt="2025年度入試受験レポート未記入用紙" draggable="false">
        <div id="overlay"></div>
      </section>
    </div>
  </main>
  <script src="fields.js"></script>
  <script src="script.js"></script>
</body>
</html>
